# Production config for the Netlify site. Astro emits a fully static dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# No SPA catch-all redirect: Astro emits dist/404.html and real directory
# index files for /de/, /impressum/ and /datenschutz/, which Netlify serves
# natively. A "/* -> /index.html" rule would return the English homepage
# for every one of those routes.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

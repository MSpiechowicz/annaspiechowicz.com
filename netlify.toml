# The site is deployed by Vercel; this file exists so the Netlify integration
# still attached to the repository produces working deploy previews rather than
# failing builds. Keep it in step with vercel.json.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro emits dist/404.html, which Netlify serves for unmatched paths, and
# directory index files for /de/, /impressum/ and /datenschutz/. No SPA
# catch-all redirect: it would serve the English homepage for every route.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
